name: Verbesserung vorschlagen
description: Schlagen Sie einen neuen oder verbesserten Kundenablauf vor.
title: "[Wunsch]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Beschreiben Sie den Vereinsablauf aus Kundensicht. Technische API- oder
        Backend-Lösungen sind nicht erforderlich.
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem soll gelöst werden?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Gewünschter Ablauf
      description: Was möchten Sie Ihrem Assistenten in normaler Vereinssprache sagen können?
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Betroffener Vereinsbereich
      placeholder: Zum Beispiel Mitglieder, Veranstaltungen oder Homepage
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Erwartetes Ergebnis
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Datenschutz
      options:
        - label: Der Vorschlag enthält keine Tokens oder personenbezogenen Vereinsdaten.
          required: true

